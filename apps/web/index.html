<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constemps</title>
    <meta name="theme-color" content="#f5f1e8" />
    <!-- Apparence Jour / Nuit / Auto (CON-73), appliquée avant tout rendu pour
         éviter un éclair clair à l'ouverture en mode nuit. Même clé, mêmes
         valeurs et même résolution que src/lib/appearance.ts, qui prend le
         relais ensuite. Couleurs : --color-canvas des deux thèmes (tokens.css).
         Une future Content-Security-Policy devra autoriser ce script (hash). -->
    <script>
      ;(function () {
        var pref = 'auto'
        try {
          var stored = window.localStorage.getItem('constemps.appearance')
          if (stored === 'jour' || stored === 'nuit' || stored === 'auto') pref = stored
        } catch (e) {}
        var nuit = pref === 'nuit' || (pref === 'auto' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        var canvas = nuit ? '#161d33' : '#f5f1e8'
        root.setAttribute('data-theme', nuit ? 'nuit' : 'jour')
        root.style.colorScheme = nuit ? 'dark' : 'light'
        root.style.backgroundColor = canvas
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', canvas)
      })()
    </script>
    <!-- Échelle de l'interface sur écran ultra large (CON-75), posée avant tout
         rendu pour éviter l'éclair d'une page plus petite. Même formule que
         src/lib/uiScale.ts, qui prend le relais au redimensionnement. -->
    <script>
      ;(function () {
        var w = window.innerWidth
        if (w <= 1440 || !window.CSS || !CSS.supports('zoom', '1')) return
        var scale = Math.min(1 + (0.75 * (w - 1440)) / 2000, 1.75, Math.max(1, window.innerHeight / 800))
        scale = Math.round(scale * 1000) / 1000
        if (scale === 1) return
        var root = document.documentElement
        root.style.setProperty('zoom', String(scale))
        root.style.setProperty('--ui-scale', String(scale))
      })()
    </script>
    <script
      src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
      integrity="sha384-GPb5RlngihS9H0z1D137JsvzmeZ7tCpWEF4t5YDoTZyMsPP8S7h7vFDh4XhheU83"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
